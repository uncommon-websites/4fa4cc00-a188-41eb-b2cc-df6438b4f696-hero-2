<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delphi | The World's Platform for Human Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>
<body class="m-0 p-0 w-full h-screen overflow-hidden bg-[#EAE8E1]">

    <!-- Main Hero Container -->
    <main class="relative w-full h-full">
        
        <!-- Background Image -->
        <!-- Using original placeholder as per instructions -->
        <img src="https://imolwncbqxugevwmleed.supabase.co/storage/v1/object/public/public-assets/hero-images/4fa4cc00-a188-41eb-b2cc-df6438b4f696/hero-2-img-0-1769779899973.png" 
             alt="Delphi Digital Minds" 
             class="absolute inset-0 w-full h-full object-cover z-0">

        <!-- Navigation Bar -->
        <header class="absolute top-0 left-0 w-full flex justify-between items-start px-6 py-6 md:px-12 md:py-10 z-10">
            
            <!-- Left: Library of Minds -->
            <div class="flex-shrink-0">
                <a href="#" class="text-[11px] md:text-[13px] tracking-[0.2em] text-[#475569] uppercase font-medium hover:text-[#3b82f6] transition-colors">
                    Library of Minds
                </a>
            </div>

            <!-- Center: Delphi Name/Headline -->
            <div class="absolute left-1/2 top-6 md:top-10 transform -translate-x-1/2 w-full text-center pointer-events-none hidden md:block">
                <h1 class="text-[13px] tracking-[0.4em] text-[#3b82f6] uppercase font-normal ml-[0.4em]">
                    Delphi &nbsp; &nbsp; Human &nbsp; Intelligence &nbsp; Scale
                </h1>
            </div>

            <!-- Right: Menu -->
            <div class="flex-shrink-0">
                <button class="flex flex-col items-center justify-center gap-[6px] group cursor-pointer border-none bg-transparent p-0">
                    <!-- Hamburger Line -->
                    <span class="w-6 h-[1.5px] bg-[#3b82f6] group-hover:w-8 transition-all duration-300 ease-out"></span>
                    <!-- Menu Text -->
                    <span class="text-[9px] tracking-[0.25em] text-[#475569] uppercase font-medium">
                        Menu
                    </span>
                </button>
            </div>
        </header>

        <!-- Bottom Left: CTA -->
        <div class="absolute bottom-0 left-0 px-6 py-6 md:px-12 md:py-10 z-10">
            <div class="flex flex-col gap-4">
                <p class="text-[10px] md:text-[12px] tracking-[0.1em] text-[#475569] uppercase max-w-xs leading-relaxed">
                    Clone your mind to democratize access to your personal wisdom.
                </p>
                <a href="#" class="text-[11px] md:text-[13px] tracking-[0.2em] text-[#3b82f6] border-b border-[#3b82f6] pb-1 w-fit uppercase font-medium hover:opacity-70 transition-opacity">
                    Create Your Digital Mind
                </a>
            </div>
        </div>

        <!-- Bottom Right (Additional Info for Delphi context) -->
        <div class="absolute bottom-0 right-0 px-6 py-6 md:px-12 md:py-10 z-10 text-right hidden md:block">
            <a href="#" class="text-[11px] md:text-[13px] tracking-[0.2em] text-[#475569] uppercase font-medium hover:text-[#3b82f6] transition-colors">
                Book a Demo
            </a>
        </div>

    </main>

</body>
</html>
